<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A refined Hello World landing page." />
    <title>Hello, World!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

      :root {
        --ink: #10151f;
        --paper: #f4f0e8;
        --orange: #ee6a3a;
        --gold: #f8c64e;
        --blue: #2e6fbb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: var(--paper);
        font-family: "DM Mono", monospace;
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: .22;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      }

      main {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 2rem;
        isolation: isolate;
      }

      .orb {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        filter: blur(1px);
        animation: drift 9s ease-in-out infinite alternate;
      }

      .orb--one {
        top: -20vh;
        left: -12vw;
        width: min(57vw, 700px);
        aspect-ratio: 1;
        background: var(--gold);
      }

      .orb--two {
        right: -13vw;
        bottom: -25vh;
        width: min(54vw, 680px);
        aspect-ratio: 1;
        background: var(--orange);
        animation-delay: -4s;
      }

      .orb--three {
        right: 9vw;
        top: 13vh;
        width: 8rem;
        aspect-ratio: 1;
        background: var(--blue);
        animation-duration: 6s;
      }

      .card {
        position: relative;
        width: min(100%, 780px);
        padding: clamp(2rem, 7vw, 5.5rem);
        overflow: hidden;
        background: rgba(255, 253, 248, .7);
        border: 1px solid rgba(16, 21, 31, .18);
        border-radius: 2px;
        box-shadow: 14px 14px 0 var(--ink), 0 28px 60px rgba(16, 21, 31, .18);
        backdrop-filter: blur(10px);
        animation: arrive .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      .card::after {
        position: absolute;
        top: 1.1rem;
        right: 1.1rem;
        width: 2.1rem;
        height: 2.1rem;
        content: "";
        border-top: 2px solid var(--ink);
        border-right: 2px solid var(--ink);
      }

      .eyebrow {
        display: flex;
        gap: .8rem;
        align-items: center;
        margin: 0 0 1.6rem;
        font-size: clamp(.67rem, 1.5vw, .8rem);
        font-weight: 500;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2.5rem;
        height: 2px;
        content: "";
        background: var(--orange);
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(4rem, 12vw, 8.5rem);
        font-weight: 700;
        letter-spacing: -.075em;
        line-height: .84;
      }

      h1 em {
        color: var(--orange);
        font-weight: 600;
      }

      .message {
        max-width: 38rem;
        margin: 2.1rem 0 0;
        font-size: clamp(.88rem, 2vw, 1rem);
        line-height: 1.75;
      }

      .nav {
        display: flex;
        gap: .5rem;
        margin: 2rem 0 0;
      }

      .nav a {
        padding: .75rem 1rem;
        color: var(--ink);
        border: 1px solid var(--ink);
        text-decoration: none;
        font-size: .75rem;
        letter-spacing: .07em;
        text-transform: uppercase;
        transition: background-color .2s ease, color .2s ease, transform .2s ease;
      }

      .nav a:hover, .nav a:focus-visible {
        color: var(--paper);
        background: var(--ink);
        transform: translateY(-2px);
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        align-items: center;
        justify-content: space-between;
        margin-top: 3.5rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(16, 21, 31, .22);
        font-size: .72rem;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .spark { color: var(--blue); font-size: 1.2rem; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(24px) rotate(-1deg); }
        to { opacity: 1; transform: translateY(0) rotate(0); }
      }

      @keyframes drift {
        to { transform: translate(2vw, 3vh) rotate(12deg); }
      }

      @media (max-width: 560px) {
        body { overflow: auto; }
        .card { box-shadow: 9px 9px 0 var(--ink), 0 20px 40px rgba(16, 21, 31, .15); }
        .orb--three { right: 5vw; top: 5vh; width: 5rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main>
      <div class="orb orb--one" aria-hidden="true"></div>
      <div class="orb orb--two" aria-hidden="true"></div>
      <div class="orb orb--three" aria-hidden="true"></div>

      <section class="card" aria-labelledby="hello-heading">
        <p class="eyebrow">A small beginning</p>
        <h1 id="hello-heading">Hello,<br /><em>World.</em></h1>
        <p class="message">
          The first line of a new idea deserves a little ceremony. Welcome to a bright, curious corner of the web.
        </p>
        <nav class="nav" aria-label="Main navigation">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
        <div class="footer">
          <span>Made with intent</span>
          <span class="spark" aria-label="spark">✦</span>
          <span>Est. 2026</span>
        </div>
      </section>
    </main>
  </body>
</html>
