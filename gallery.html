<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A colorful collection of small moments." />
    <title>Gallery — Hello, World!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");
      :root { --ink:#10151f; --paper:#f4f0e8; --orange:#ee6a3a; --gold:#f8c64e; --blue:#2e6fbb; --pink:#e685a4; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:"DM Mono",monospace; }
      main { width:min(100%,1100px); margin:auto; padding:clamp(1.5rem,5vw,4rem); }
      .eyebrow { display:flex; gap:.8rem; align-items:center; margin:0 0 1.1rem; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; }
      .eyebrow::before { width:2.5rem; height:2px; content:""; background:var(--orange); }
      header { display:flex; gap:2rem; align-items:end; justify-content:space-between; padding-bottom:2.5rem; border-bottom:1px solid rgba(16,21,31,.25); }
      h1 { margin:0; font-family:"Playfair Display",Georgia,serif; font-size:clamp(4rem,10vw,7.5rem); letter-spacing:-.075em; line-height:.84; }
      h1 em { color:var(--orange); font-weight:600; }
      .intro { max-width:25rem; margin:0 0 .3rem; line-height:1.7; font-size:.85rem; }
      .grid { display:grid; grid-template-columns:repeat(12,1fr); grid-auto-rows:minmax(100px,11vw); gap:clamp(.75rem,2vw,1.5rem); margin:clamp(2rem,5vw,4rem) 0; }
      .tile { position:relative; display:flex; align-items:end; padding:1.25rem; overflow:hidden; color:var(--ink); border:1px solid rgba(16,21,31,.18); box-shadow:5px 5px 0 var(--ink); transition:transform .25s ease,box-shadow .25s ease; }
      .tile:hover { transform:translate(-4px,-4px); box-shadow:9px 9px 0 var(--ink); }
      .tile span { position:relative; z-index:1; padding:.35rem .55rem; background:rgba(255,253,248,.83); font-size:.7rem; font-weight:500; letter-spacing:.09em; text-transform:uppercase; }
      .tile::before,.tile::after { position:absolute; content:""; border-radius:50%; }
      .one { grid-column:span 5; grid-row:span 3; background:var(--gold); }.one::before { width:65%; aspect-ratio:1; top:8%; right:-10%; background:var(--orange); }.one::after { width:28%; aspect-ratio:1; bottom:15%; left:12%; background:var(--blue); }
      .two { grid-column:span 7; grid-row:span 2; background:var(--blue); }.two::before { width:37%; aspect-ratio:1; top:-20%; left:11%; background:var(--paper); }.two::after { width:42%; aspect-ratio:1; right:4%; bottom:-36%; background:var(--pink); }
      .three { grid-column:span 4; grid-row:span 3; background:var(--orange); }.three::before { width:70%; aspect-ratio:1; top:-20%; right:-12%; background:var(--ink); }.three::after { width:24%; aspect-ratio:1; bottom:18%; left:15%; background:var(--gold); }
      .four { grid-column:span 3; grid-row:span 2; background:var(--pink); }.four::before { width:100%; aspect-ratio:1; top:14%; left:-34%; background:var(--gold); }.four::after { width:34%; aspect-ratio:1; right:10%; bottom:17%; background:var(--blue); }
      .five { grid-column:span 5; grid-row:span 2; background:var(--ink); color:var(--paper); }.five::before { width:55%; aspect-ratio:1; top:-25%; right:6%; background:var(--gold); }.five::after { width:32%; aspect-ratio:1; bottom:13%; left:18%; background:var(--orange); }
      nav { display:flex; flex-wrap:wrap; gap:.5rem; padding-top:1.5rem; border-top:1px solid rgba(16,21,31,.25); }
      nav a { padding:.75rem 1rem; color:var(--ink); border:1px solid var(--ink); text-decoration:none; font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; transition:.2s ease; }
      nav a:hover,nav a:focus-visible,nav a[aria-current="page"] { color:var(--paper); background:var(--ink); transform:translateY(-2px); }
      @media (max-width:620px) { header { display:block; }.intro { margin-top:1.5rem; }.grid { grid-auto-rows:28vw; gap:1rem; }.one,.two,.three,.four,.five { grid-column:span 12; grid-row:span 2; }.one { grid-row:span 3; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">A collection</p>
          <h1>Little<br /><em>things.</em></h1>
        </div>
        <p class="intro">A handful of colorful compositions—proof that a gallery can be playful before it holds a single photograph.</p>
      </header>
      <section class="grid" aria-label="Colorful abstract gallery">
        <article class="tile one"><span>Sunrise</span></article>
        <article class="tile two"><span>Drift</span></article>
        <article class="tile three"><span>Contrast</span></article>
        <article class="tile four"><span>Bloom</span></article>
        <article class="tile five"><span>Night light</span></article>
      </section>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </main>
  </body>
</html>
